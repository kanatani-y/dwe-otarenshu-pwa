<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#78c9ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DWEれんしゅう">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>DWE おうたれんしゅう</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef9ff}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    #loading{position:fixed;inset:0;display:grid;place-items:center;color:#554665;font:800 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(145deg,#fff0f6,#eaf8ff);z-index:1}
    .ready{display:none!important}
  </style>
</head>
<body>
  <div id="loading">🎵 よみこみ中…</div>
  <iframe
    title="DWE おうたれんしゅう"
    src="https://script.google.com/a/macros/satosho.gse.okayama-c.ed.jp/s/AKfycbxLLozf_B0wQ1yMZmrlXEQC7oVxny5BOrXaAqR4oVCsY9fnssD_dQBHMtcSwgmJTn38iw/exec"
    allow="autoplay; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    document.querySelector('iframe').addEventListener('load',()=>document.getElementById('loading').classList.add('ready'));
    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
  </script>
</body>
</html>
